<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#95b4cc">
<title>小地球</title>
<meta name="description" content="一颗可以旋转与靠近的小地球。">
<link rel="stylesheet" href="./style.css">
<link rel="modulepreload" href="./app.js">
</head>
<body>
<main aria-label="可交互的小地球" aria-busy="true">
<canvas id="world" tabindex="-1" aria-describedby="hint" aria-label="三维小地球。拖动旋转，滚轮缩放，也可使用方向键和加减键。"></canvas>
<header><h1>小地球</h1><p id="hint">拖动旋转 · 滚轮缩放</p></header>
<button class="light-toggle" id="lighting-control" type="button" data-scene-control disabled aria-label="调整光照" aria-expanded="false" aria-controls="lighting-panel" title="调整光照"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
<button class="reset" id="reset" type="button" data-scene-control disabled aria-label="回到初始视角" title="回到初始视角（Home）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9a7 7 0 1 1-.3 5M5 4v5h5"/></svg></button>
<section id="lighting-panel" class="lighting-panel" aria-labelledby="lighting-title" hidden>
<div class="panel-heading"><h2 id="lighting-title">光照</h2><button id="lighting-close" type="button" aria-label="关闭光照设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
<div class="light-presets" role="group" aria-label="光照预设"><button type="button" data-preset="day" aria-pressed="true">晴日</button><button type="button" data-preset="warm" aria-pressed="false">暖阳</button><button type="button" data-preset="side" aria-pressed="false">侧光</button></div>
<label class="light-field" for="light-sun"><span>日照强度</span><output id="light-sun-value" for="light-sun">135%</output><input id="light-sun" type="range" min="0" max="200" value="135" step="1" data-light="sun" data-unit="%"></label>
<label class="light-field" for="light-fill"><span>暗部补光</span><output id="light-fill-value" for="light-fill">55%</output><input id="light-fill" type="range" min="0" max="100" value="55" step="1" data-light="fill" data-unit="%"></label>
<label class="light-field" for="light-brightness"><span>整体亮度</span><output id="light-brightness-value" for="light-brightness">110%</output><input id="light-brightness" type="range" min="70" max="150" value="110" step="1" data-light="brightness" data-unit="%"></label>
<details class="sun-position"><summary>太阳位置</summary>
<label class="light-field" for="light-azimuth"><span>方向</span><output id="light-azimuth-value" for="light-azimuth">32°</output><input id="light-azimuth" type="range" min="-150" max="150" value="32" step="1" data-light="azimuth" data-unit="°"></label>
<label class="light-field" for="light-elevation"><span>高度</span><output id="light-elevation-value" for="light-elevation">42°</output><input id="light-elevation" type="range" min="10" max="80" value="42" step="1" data-light="elevation" data-unit="°"></label>
</details>
<button class="lighting-reset" id="lighting-reset" type="button">恢复默认光照</button>
<a class="comparison-link" href="./foundation/">查看基础版对照</a>
</section>
<nav class="controls" aria-label="视野">
<button id="out" type="button" data-scene-control disabled aria-label="缩小" title="缩小（−）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
<output id="zoom-value" aria-label="相对初始视角的放大比例">100%</output>
<button id="in" type="button" data-scene-control disabled aria-label="放大" title="放大（+）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg></button>
</nav>
<div id="loading" class="status-card" role="status">
<span class="loading-orbit" aria-hidden="true"></span>
<p class="status-title">正在加载小地球</p>
<p id="loading-detail">正在准备陆地与海洋</p>
<a href="./foundation/">打开基础版</a>
</div>
<div id="error" class="status-card" role="alert" hidden>
<h2>小地球暂时没有显示</h2>
<p id="error-message">画面加载失败，请重新加载，或先打开基础版。</p>
<button id="retry" type="button">重新加载</button>
<a href="./foundation/">打开基础版</a>
</div>
<noscript><div class="status-card">请启用 JavaScript，查看三维小地球。</div></noscript>
</main>
<script type="module" src="./boot.js"></script>
</body>
</html>
