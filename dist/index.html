<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#95b4cc">
<title>小地球</title>
<meta name="description" content="一颗可以旋转与靠近的小地球。">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main aria-label="可交互的小地球">
<canvas id="world" tabindex="0" aria-label="三维小地球。拖动旋转，滚轮缩放，也可使用方向键和加减键。"></canvas>
<header><h1>小地球</h1><p id="hint">拖动旋转 · 滚轮缩放</p></header>
<button class="light-toggle" id="lighting-control" type="button" aria-label="调整光照" aria-expanded="false" aria-controls="lighting-panel" title="调整光照"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
<button class="reset" id="reset" type="button" aria-label="回到初始视角" title="回到初始视角"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9a7 7 0 1 1-.3 5M5 4v5h5"/></svg></button>
<section id="lighting-panel" class="lighting-panel" aria-labelledby="lighting-title" hidden>
<div class="panel-heading"><h2 id="lighting-title">光照</h2><button id="lighting-close" type="button" aria-label="关闭光照设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
<div class="light-presets" role="group" aria-label="光照预设"><button type="button" data-preset="day" aria-pressed="true">晴日</button><button type="button" data-preset="warm" aria-pressed="false">暖阳</button><button type="button" data-preset="side" aria-pressed="false">侧光</button></div>
<label class="light-field" for="light-sun"><span>日照强度</span><output id="light-sun-value" for="light-sun">135%</output><input id="light-sun" type="range" min="0" max="200" value="135" step="1" data-light="sun" data-unit="%"></label>
<label class="light-field" for="light-fill"><span>暗部补光</span><output id="light-fill-value" for="light-fill">55%</output><input id="light-fill" type="range" min="0" max="100" value="55" step="1" data-light="fill" data-unit="%"></label>
<label class="light-field" for="light-brightness"><span>整体亮度</span><output id="light-brightness-value" for="light-brightness">110%</output><input id="light-brightness" type="range" min="70" max="150" value="110" step="1" data-light="brightness" data-unit="%"></label>
<details class="sun-position"><summary>太阳位置</summary>
<label class="light-field" for="light-azimuth"><span>方向</span><output id="light-azimuth-value" for="light-azimuth">-38°</output><input id="light-azimuth" type="range" min="-150" max="150" value="-38" step="1" data-light="azimuth" data-unit="°"></label>
<label class="light-field" for="light-elevation"><span>高度</span><output id="light-elevation-value" for="light-elevation">42°</output><input id="light-elevation" type="range" min="10" max="80" value="42" step="1" data-light="elevation" data-unit="°"></label>
</details>
<button class="lighting-reset" id="lighting-reset" type="button">恢复默认光照</button>
</section>
<nav class="controls" aria-label="视野">
<button id="out" type="button" aria-label="缩小" title="缩小"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
<span aria-hidden="true"></span>
<button id="in" type="button" aria-label="放大" title="放大"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg></button>
</nav>
<div id="error" role="status" hidden></div>
</main>
<script type="module" src="./world.js"></script>
</body>
</html>
